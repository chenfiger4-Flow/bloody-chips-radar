# ===== 观察池 =====
# type: etf / mega / newlisting / crypto_major / crypto_alt
# bench: 相对强弱基准
# dd_trigger: 距60日高点回撤多少进入 S1（压力观察）
# vol_sc: 判定 SC（抛售高潮）候选所需的最低量比
# 注意：所有阈值均未经历史检验，仅作观察提醒。

watchlist:
  - {ticker: SPY,   name: S&P500 ETF,   type: etf,        bench: null,     dd_trigger: 0.08, vol_sc: 2.0, cluster: us_beta}
  - {ticker: QQQ,   name: Nasdaq100 ETF,type: etf,        bench: SPY,      dd_trigger: 0.10, vol_sc: 2.0, cluster: us_beta}
  - {ticker: AAPL,  name: Apple,        type: mega,       bench: QQQ,      dd_trigger: 0.12, vol_sc: 2.0, cluster: us_beta}
  - {ticker: MSFT,  name: Microsoft,    type: mega,       bench: QQQ,      dd_trigger: 0.12, vol_sc: 2.0, cluster: us_beta}
  - {ticker: NVDA,  name: Nvidia,       type: mega,       bench: QQQ,      dd_trigger: 0.15, vol_sc: 2.0, cluster: us_beta}
  - {ticker: AMZN,  name: Amazon,       type: mega,       bench: QQQ,      dd_trigger: 0.12, vol_sc: 2.0, cluster: us_beta}
  - {ticker: GOOGL, name: Alphabet,     type: mega,       bench: QQQ,      dd_trigger: 0.12, vol_sc: 2.0, cluster: us_beta}
  - {ticker: META,  name: Meta,         type: mega,       bench: QQQ,      dd_trigger: 0.15, vol_sc: 2.0, cluster: us_beta}
  - {ticker: TSLA,  name: Tesla,        type: mega,       bench: QQQ,      dd_trigger: 0.20, vol_sc: 2.0, cluster: us_beta}
  - {ticker: SPCX,  name: SpaceX,       type: newlisting, bench: QQQ,      dd_trigger: 0.20, vol_sc: 2.5, cluster: us_beta}
  - {ticker: CRCL,  name: Circle,       type: newlisting, bench: QQQ,      dd_trigger: 0.20, vol_sc: 2.5, cluster: crypto_beta}
  - {ticker: BTC-USD, name: Bitcoin,    type: crypto_major, bench: null,   dd_trigger: 0.15, vol_sc: 1.8, cluster: crypto_beta}
  - {ticker: HYPE32196-USD, name: Hyperliquid, type: crypto_alt, bench: BTC-USD, dd_trigger: 0.25, vol_sc: 1.8, cluster: crypto_beta}

# ===== 宏观代理 =====
macro:
  - {ticker: ^VIX,     name: VIX}
  - {ticker: ^TNX,     name: US10Y}
  - {ticker: DX-Y.NYB, name: DXY}
  - {ticker: SMH,      name: SMH}

# ===== 预写失效条件（恐慌时只回答“命中几条”，不临场找理由）=====
# v3 修订原则：每条必须有口径（TTM/单季/环比）+ 数据来源，能在财报或公开数据里直接查到是/否。
# “资本开支导致 FCF 转负”不算失效（那是投资），“经营现金流下滑 / 分部利润率下滑”才算（那是生意变差）。
failure_conditions:
  SPY:   ["ISM制造业+服务业 PMI 同时<50 且连续两月（ISM 官网）", "高收益债利差(FRED: BAMLH0A0HYM2) 30日内走阔>150bp", "标普500 成分股前瞻EPS 一致预期 30日内下修>5%（FactSet）"]
  QQQ:   ["Mag7 中≥3家下修全年资本开支指引（AI 需求证伪）", "10Y 收盘>5.0% 且 20个交易日内上行>50bp（2026-09 已在 5.0% 边缘，重点盯）", "SMH 相对 QQQ 20日 RS<-8%（半导体领跌）"]
  AAPL:  ["iPhone 收入连续两季同比下滑>5%", "服务收入增速跌破 8%", "大中华区收入同比下滑>15%"]
  MSFT:  ["Azure 增速（固定汇率）跌破 25%（FY26Q4: 43%）", "商业 RPO 同比增速连续两季下降", "FCF(TTM) 转负 — 管理层已承诺 FY27 FCF 为正，若违背即失效"]
  NVDA:  ["数据中心收入环比转负", "前两大客户任一公开宣布削减 GPU 订单或改用自研芯片替代>30%", "GAAP 毛利率跌破 65%（当前约 70-75%）"]
  AMZN:  ["AWS 增速跌破 20%（2026Q2: 37%，连续加速）", "AWS 经营利润率跌破 32%（2026Q2: 39%；2024-25 区间 33-38%）", "经营现金流(TTM) 同比下滑（2026Q2: 增长；FCF 因 capex 转负不算）"]
  GOOGL: ["搜索收入增速跌破 5%（2026Q2: +17%）", "Google Cloud 积压订单环比下降", "反垄断判决强制拆分 Search/Android/Chrome 任一"]
  META:  ["Family DAP（日活人数）环比下滑（Meta 已停报 DAU）", "广告收入增速跌破 8%", "Reality Labs 年亏损>250亿 且 总 capex 指引再上调"]
  TSLA:  ["汽车毛利率（不含碳积分）跌破 10%（2025 区间 12-15%，离阈值近）", "交付量连续两季同比下滑>10%", "Robotaxi/FSD 无监督商业化时间表再次推迟>6个月（估值主要靠此叙事）"]
  SPCX:  ["Starlink 收入增速跌破 30% 或 用户数环比停滞", "锁定期解禁前后10个交易日禁止新开仓（交易纪律，非基本面）", "重大发射事故导致 Falcon/Starship 停飞>3个月"]
  CRCL:  ["USDC 流通市值 60日内下滑>20%（DefiLlama）", "联储累计降息>100bp 且非利息收入占比仍<15%", "稳定币立法出现禁止付息/限制发行人的重大不利变化"]
  BTC-USD: ["现货 ETF 连续 4 周净流出（Farside）", "美国政策转向明确打压（战略储备取消/交易所监管收紧）", "稳定币总市值 60日内萎缩>15%（DefiLlama）"]
  HYPE32196-USD: ["Assistance Fund 回购停止或月度回购额缩减>50%", "永续 DEX 市占率跌破 40%（DefiLlama Derivatives）", "重大安全事件（>1亿美元）或主要司法辖区封禁"]

# ===== 通知 =====
notify:
  always_send_brief: true      # 每次运行都发简报（false = 仅状态变化时发）
