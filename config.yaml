failure_conditions:
  SPY:   ["ISM制造业+服务业同时跌破50且连续两月", "高收益债利差快速走阔>150bp/月"]
  QQQ:   ["Mag7 资本开支指引集体下修", "10Y 收益率快速上破 5%"]
  AAPL:  ["iPhone 收入连续两季同比下滑>5%", "服务业务增速跌破 8%", "中国区收入同比下滑>15%"]
  MSFT:  ["Azure 增速跌破 25%", "AI 资本开支无法转化为云收入增长（连续两季）"]
  NVDA:  ["数据中心收入环比转负", "主要客户公开宣布大幅削减 GPU 订单", "毛利率跌破 65%"]
  AMZN:  ["AWS 增速跌破 12%", "自由现金流连续两季转负"]
  GOOGL: ["搜索收入同比负增长", "反垄断判决强制拆分核心业务"]
  META:  ["日活用户环比下滑", "Reality Labs 亏损扩大且资本开支不减", "广告收入增速跌破 8%"]
  TSLA:  ["汽车毛利率（不含碳积分）跌破 10%", "交付量连续两季同比下滑>10%"]
