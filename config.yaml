  BTC-USD: ["现货 ETF 连续 4 周净流出", "美国政策转向明确打压", "稳定币总市值持续萎缩>15%"]
  HYPE32196-USD: ["回购机制停止或大幅缩减", "交易量份额被竞争对手持续侵蚀", "重大安全事件或监管封禁"]

# ===== 通知 =====
notify:
  always_send_brief: true      # 每次运行都发简报（false = 仅状态变化时发）
