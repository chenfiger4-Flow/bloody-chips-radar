name: bloody-chips-radar

on:
  schedule:
    # 加密：UTC 00:15 / 12:15 = 北京 08:15 / 20:15
    - cron: "15 0,12 * * *"
    # 美股：UTC 22:30 周二至周六 = 收盘后（夏令时 +2.5h，冬令时 +1.5h）
    - cron: "30 22 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "us / crypto / all"
        default: "all"

permissions:
  contents: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt

      - name: Decide mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ github.event.inputs.mode }}" >> $GITHUB_OUTPUT
          elif [ "$(date -u +%H)" = "22" ]; then
            echo "mode=us" >> $GITHUB_OUTPUT
          else
            echo "mode=crypto" >> $GITHUB_OUTPUT
          fi

      - name: Run radar
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python radar.py ${{ steps.mode.outputs.mode }}

      - name: Commit outputs
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add docs/
          git diff --cached --quiet || git commit -m "radar: $(date -u +'%Y-%m-%d %H:%M') ${{ steps.mode.outputs.mode }}"
          git push
